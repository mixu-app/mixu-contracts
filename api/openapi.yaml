openapi: 3.1.0
info:
  title: Mixu API (proposal)
  version: 0.1.0-draft
  description: |
    Draft `/v1` HTTP surface for the hosted Mixu service. This document is a
    proposal, not a published contract: routes, payloads and error codes may
    change until the connected-beta milestone (M3).

    Rules that already hold:

    - Authenticated endpoints accept a Cognito JWT; the server maps the external
      identity to the internal immutable user UUID. A client never chooses an
      owner id in a request.
    - Every mutating request carries an idempotency key or a stable
      client-generated mutation id.
    - Book files move through short-lived presigned S3 URLs, never through this
      API body.
    - Error bodies follow `error.schema.json`; clients branch on `code`.
    - No response returns credentials, full book content, or graph data beyond
      the authorized reveal horizon.

    Conventions:

    - Idempotency: Mutating operations (such as `POST /jobs`, `POST /sync/push`,
      and `POST /jobs/{job_id}/cancel`) accept an `idempotency_key` or mutation id.
      Retrying with the same key returns the existing resource without re-executing
      side effects.
    - Pagination: Collections (such as `GET /jobs` and `GET /sync/pull`) use
      opaque cursor-based pagination with `cursor` and optional `limit` query
      parameters, returning a `next_cursor` when subsequent records exist.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: https://api.mixu.app/v1
    description: Placeholder host. Production hostnames are not part of this proposal.
security:
  - bearerAuth: []
tags:
  - name: health
  - name: account
  - name: sync
  - name: graphs
  - name: catalog
  - name: billing
  - name: storage
  - name: uploads
  - name: jobs
x-mixu-status: proposal
paths:
  /health:
    get:
      operationId: getHealth
      summary: Service readiness
      description: Redacted readiness probe. Returns no version detail, no secrets, no dependency credentials.
      security: []
      tags: [health]
      responses:
        "200":
          description: Service is able to serve authenticated traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/Unavailable"
  /me:
    get:
      operationId: getMe
      summary: Internal account profile
      description: Returns the Mixu-internal profile for the authenticated identity (display name, quota summary). Never returns provider tokens.
      tags: [account]
      responses:
        "200":
          description: Profile of the authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: patchMe
      summary: Update display name
      description: Only display attributes are mutable here; the immutable user id and username are not client-writable.
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                display_name:
                  type: string
                  maxLength: 64
              required: [display_name]
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /sync/push:
    post:
      operationId: pushSyncMutations
      summary: Apply idempotent local mutations
      description: |
        Applies queued local mutations (progress, bookmarks, notes, overlays).
        The server deduplicates by `mutation_id`; a concurrent edit returns a
        conflict or a conflict copy, never a silent overwrite. Responses carry a
        `next_cursor` for the follow-up pull.
      tags: [sync]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncPushRequest"
      responses:
        "200":
          description: Per-mutation outcomes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncPushResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /sync/pull:
    get:
      operationId: pullSyncChanges
      summary: Retrieve authorized changes
      description: Returns mutations applied since the cursor for the authenticated account only.
      tags: [sync]
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Changed objects and the next cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncPullResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /graphs/{pack_id}/download:
    get:
      operationId: getGraphPackDownload
      summary: Authorized graph pack URL and manifest
      description: |
        Returns a short-lived download URL plus the pack manifest. The caller must
        already own the book edition or qualify for the rights-cleared public
        catalog; a client-supplied edition claim is verified server-side.
      tags: [graphs]
      parameters:
        - name: pack_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Download intent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphPackDownload"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /uploads/intent:
    post:
      operationId: createUploadIntent
      summary: Request presigned upload URL
      description: |
        Generates a short-lived presigned S3 upload URL with a SHA-256 checksum constraint
        and maximum size limit. The client uploads the book file directly to object storage.
        Returns `INVALID_REQUEST` on invalid input or `STORAGE_QUOTA_EXCEEDED` if quota is full.
      tags: [uploads]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadIntentRequest"
      responses:
        "200":
          description: Presigned upload session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadIntentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /jobs:
    post:
      operationId: createJob
      summary: Create an extraction or validation job
      description: |
        Creates an asynchronous narrative extraction or edition validation job from a verified
        uploaded asset. The operation is idempotent via `idempotency_key`. Retrying with the
        same key returns the existing job. Returns `NOT_FOUND` if the upload does not exist,
        `UPLOAD_NOT_VERIFIED` if checksum verification failed, or `INVALID_EDITION` if the
        edition is not recognized.
      tags: [jobs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobRequest"
      responses:
        "201":
          description: Job created and queued for execution, or existing job returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      operationId: listJobs
      summary: List asynchronous jobs
      description: |
        Retrieves a paginated list of background processing jobs for the authenticated
        user, ordered by creation time descending.
      tags: [jobs]
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque pagination cursor from a previous page.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of jobs to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          required: false
          description: Optional filter by job lifecycle status.
          schema:
            $ref: "#/components/schemas/JobStatus"
      responses:
        "200":
          description: Paginated list of jobs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /jobs/{job_id}:
    get:
      operationId: getJob
      summary: Get job status and execution details
      description: |
        Returns the current state, progress percentage, step details, and any error
        information for a background processing job. Returns `NOT_FOUND` if the job
        does not exist or is not owned by the authenticated caller.
      tags: [jobs]
      parameters:
        - name: job_id
          in: path
          required: true
          description: Unique job identifier.
          schema:
            type: string
      responses:
        "200":
          description: Current job status and progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /jobs/{job_id}/cancel:
    post:
      operationId: cancelJob
      summary: Request cooperative cancellation
      description: |
        Requests cooperative cancellation of an in-flight background job. The worker stops
        processing at the next safe cancellation checkpoint. If cancelled, the job transitions
        to `cancelled` with error code `BUILD_CANCELLED`. Returns `NOT_FOUND` if the job does not
        exist, or `409` Conflict if the job is already in a terminal state.
      tags: [jobs]
      parameters:
        - name: job_id
          in: path
          required: true
          description: Unique job identifier.
          schema:
            type: string
      responses:
        "200":
          description: Cancellation request recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobCancelResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /jobs/{job_id}/result:
    get:
      operationId: getJobResult
      summary: Get completed job result
      description: |
        Returns the download intent and graph pack reference for a completed job.
        Returns `NOT_FOUND` if the job does not exist, or `409` Conflict if the job
        is still processing, queued, failed, or cancelled.
      tags: [jobs]
      parameters:
        - name: job_id
          in: path
          required: true
          description: Unique job identifier.
          schema:
            type: string
      responses:
        "200":
          description: Job result details and graph pack download reference.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResultResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /billing/wallet:
    get:
      operationId: getBillingWallet
      summary: Three-bucket Credit wallet summary
      description: |
        Returns the authenticated user's three-bucket Credit wallet (`GET /v1/billing/wallet`).
        Monetary anchor: `1 Credit = 100 minor_units` (`100 Credits = ¥1.00 RMB`).
        Credits are consumed strictly in order `promo_credits_minor -> sub_credits_minor -> paid_credits_minor`.
      tags: [billing]
      responses:
        "200":
          description: Three-bucket Credit wallet balance summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /billing/ad-rewards/qr-challenge:
    post:
      operationId: createAdRewardQrChallenge
      summary: Generate E-Ink cross-device QR ad challenge
      description: |
        Generates a short-lived cross-device QR session token (`POST /v1/billing/ad-rewards/qr-challenge`)
        for E-Ink devices where `eink_mode=true` so that video ads are completed on a companion phone
        without initializing video ad SDKs on E-Ink hardware.
      tags: [billing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdRewardQrChallengeRequest"
      responses:
        "200":
          description: Short-lived cross-device QR challenge created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdRewardQrChallengeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /billing/ad-rewards/verify:
    post:
      operationId: verifyAdReward
      summary: Verify rewarded ad completion and grant promo credits
      description: |
        Server-side verification callback (`POST /v1/billing/ad-rewards/verify`) granting
        `+300 minor_units` (`3 promo_credits`) per verified ad idempotently, subject to a daily cap
        of `3000 minor_units` (`30 Credits/day`). Returns `RATE_LIMITED` when the daily ad reward cap
        is exceeded or `INVALID_REQUEST` when the signature is invalid.
      tags: [billing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdRewardVerifyRequest"
      responses:
        "200":
          description: Ad reward verified and promo credits granted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdRewardVerifyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /catalog/packs/{packId}/publish:
    post:
      operationId: publishMarketplacePack
      summary: Publish validated GraphPack to shared marketplace
      description: |
        Publishes an owner-validated GraphPack to the Community Shared GraphPack Marketplace
        (`POST /v1/catalog/packs/{packId}/publish`, ADR-040) for `0` upload fee, recording
        `epub_sha256` (L1 exact binary match), `structure_fingerprint` (L2 structural skeleton match),
        `isbn` (L3 metadata match), and `build_cost_minor` (used to cap creator royalties at `200%`).
      tags: [catalog]
      parameters:
        - name: packId
          in: path
          required: true
          description: Unique graph pack identifier to publish.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishMarketplacePackRequest"
      responses:
        "200":
          description: GraphPack published to shared marketplace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplacePackSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /catalog/packs/{packId}/purchase:
    post:
      operationId: purchaseMarketplacePack
      summary: Purchase or unlock a community shared GraphPack
      description: |
        Downloads/unlocks a community shared GraphPack (`POST /v1/catalog/packs/{packId}/purchase`, ADR-040)
        for `300 minor_units` (`3 Credits`), granting `+100 minor_units` (`+1 promo_credit`) creator royalty
        to the original uploader up to `200%` of `build_cost_minor`. Pack owners download for `0` charge.
        Returns `INSUFFICIENT_CREDITS` if the buyer's available balance is below `300 minor_units`.
      tags: [catalog]
      parameters:
        - name: packId
          in: path
          required: true
          description: Unique graph pack identifier to purchase or unlock.
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseMarketplacePackRequest"
      responses:
        "200":
          description: Shared GraphPack unlocked and download intent issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseMarketplacePackResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /storage/quota:
    get:
      operationId: getStorageQuota
      summary: Cloud storage quota and 7-day grace period status
      description: |
        Returns the authenticated user's cloud storage quota, byte usage, subscription status
        (`ACTIVE | GRACE_PERIOD | OVER_QUOTA_EVICTED`), and `grace_period_ends_at` timestamp
        (`GET /v1/storage/quota`, ADR-030).
      tags: [storage]
      responses:
        "200":
          description: Current storage quota and subscription grace period state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageQuotaSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito access token. The app client is public; no client secret is ever embedded.
  schemas:
    Health:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok, degraded]
      required: [status]
    AccountProfile:
      type: object
      additionalProperties: false
      properties:
        user_id:
          type: string
          description: Mixu-internal immutable UUID, not a Cognito subject.
        username:
          type: string
        display_name:
          type: string
        email_verified:
          type: boolean
        storage_quota_bytes:
          type: integer
          minimum: 0
      required: [user_id, username, email_verified]
    SyncMutation:
      type: object
      additionalProperties: false
      properties:
        mutation_id:
          type: string
        object_type:
          type: string
          enum: [progress, bookmark, note, overlay]
        object_id:
          type: string
        base_revision:
          type: integer
          minimum: 0
        operation:
          type: string
          enum: [create, edit, delete]
        payload:
          type: object
          additionalProperties: true
      required: [mutation_id, object_type, object_id, operation, payload]
    SyncPushRequest:
      type: object
      additionalProperties: false
      properties:
        device_id:
          type: string
        mutations:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/SyncMutation"
      required: [device_id, mutations]
    SyncMutationResult:
      type: object
      additionalProperties: false
      properties:
        mutation_id:
          type: string
        status:
          type: string
          enum: [applied, duplicate, conflict, rejected]
        revision:
          type: integer
          minimum: 0
        conflict_id:
          type: string
      required: [mutation_id, status]
    SyncPushResponse:
      type: object
      additionalProperties: false
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SyncMutationResult"
        next_cursor:
          type: string
      required: [results, next_cursor]
    SyncPullResponse:
      type: object
      additionalProperties: false
      properties:
        changes:
          type: array
          items:
            type: object
            additionalProperties: true
        next_cursor:
          type: string
      required: [changes, next_cursor]
    GraphPackDownload:
      type: object
      additionalProperties: false
      properties:
        pack_id:
          type: string
        download_url:
          type: string
          description: Short-lived presigned URL. Treat as a bearer capability; do not log or share it.
        expires_at:
          type: string
          format: date-time
        manifest:
          type: object
          additionalProperties: true
          description: Must validate against the graph pack manifest schema (schemas/graph/graph-pack-manifest.schema.json).
      required: [pack_id, download_url, expires_at, manifest]
    UploadIntentRequest:
      type: object
      additionalProperties: false
      description: Parameters for requesting a presigned direct upload URL.
      properties:
        filename:
          type: string
          description: Original file name of the asset to upload.
        content_type:
          type: string
          description: MIME type of the uploaded file (e.g. application/epub+zip).
        size_bytes:
          type: integer
          minimum: 1
          description: Exact size of the asset file in bytes.
        sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: Hex-encoded SHA-256 digest of the file contents.
        purpose:
          type: string
          enum: [graph_build, edition_validation]
          description: Intended processing workflow for the uploaded file.
      required: [filename, content_type, size_bytes, sha256, purpose]
    UploadIntentResponse:
      type: object
      additionalProperties: false
      description: Presigned upload URL and authorization parameters.
      properties:
        upload_id:
          type: string
          description: Unique identifier for tracking this upload session.
        upload_url:
          type: string
          description: Short-lived presigned URL. Treat as a bearer capability; do not log or share it.
        expires_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the presigned URL expires.
        max_size_bytes:
          type: integer
          minimum: 1
          description: Maximum allowed payload size in bytes for the upload.
        required_headers:
          type: object
          additionalProperties: true
          description: HTTP headers that must be sent with the direct upload request.
      required: [upload_id, upload_url, expires_at, max_size_bytes]
    JobStatus:
      type: string
      enum: [queued, processing, completed, failed, cancelled]
      description: Current execution status of an asynchronous job.
    JobProgress:
      type: object
      additionalProperties: false
      description: Execution progress tracking information for a background job.
      properties:
        percentage:
          type: integer
          minimum: 0
          maximum: 100
          description: Completion percentage from 0 to 100.
        current_step:
          type: string
          description: Name of the pipeline step currently executing.
        total_steps:
          type: integer
          minimum: 1
          description: Total number of discrete steps in the processing pipeline.
        step_index:
          type: integer
          minimum: 0
          description: Zero-based index of the current execution step.
        message:
          type: string
          description: Safe human-readable progress message without sensitive context.
      required: [percentage, current_step]
    CreateJobRequest:
      type: object
      additionalProperties: false
      description: Request payload to create an extraction or validation job.
      properties:
        idempotency_key:
          type: string
          maxLength: 128
          description: Client-supplied key to ensure idempotent job creation.
        upload_id:
          type: string
          description: Identifier of the completed and verified asset upload.
        job_type:
          type: string
          enum: [extraction, validation]
          default: extraction
          description: Type of processing job to execute.
        work_id:
          type: string
          description: Canonical work identifier associated with the asset.
        edition_id:
          type: string
          description: Target edition identifier for fingerprinting and alignment.
        options:
          type: object
          additionalProperties: true
          description: Optional execution flags and algorithm parameters.
      required: [idempotency_key, upload_id, work_id, edition_id]
    JobSummary:
      type: object
      additionalProperties: false
      description: Summary representation of an asynchronous job.
      properties:
        job_id:
          type: string
          description: Unique identifier of the job.
        job_type:
          type: string
          enum: [extraction, validation]
          description: Type of processing job.
        status:
          $ref: "#/components/schemas/JobStatus"
        work_id:
          type: string
          description: Canonical work identifier.
        edition_id:
          type: string
          description: Edition identifier.
        progress:
          $ref: "#/components/schemas/JobProgress"
        created_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the job was enqueued.
        updated_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp of last status update.
        completed_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp when processing reached terminal status.
      required:
        [job_id, job_type, status, work_id, edition_id, created_at, updated_at]
    JobDetail:
      type: object
      additionalProperties: false
      description: Detailed state and telemetry of an asynchronous job.
      properties:
        job_id:
          type: string
          description: Unique identifier of the job.
        job_type:
          type: string
          enum: [extraction, validation]
          description: Type of processing job.
        status:
          $ref: "#/components/schemas/JobStatus"
        work_id:
          type: string
          description: Canonical work identifier.
        edition_id:
          type: string
          description: Edition identifier.
        upload_id:
          type: string
          description: Source upload identifier used to spawn this job.
        progress:
          $ref: "#/components/schemas/JobProgress"
        created_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the job was enqueued.
        updated_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp of last status update.
        completed_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp when processing reached terminal status.
        error_code:
          type: string
          description: Machine-readable error code if the job failed.
        error_message:
          type: string
          description: Human-readable error description if the job failed.
        pack_id:
          type: string
          description: Resulting graph package identifier if job completed successfully.
        options:
          type: object
          additionalProperties: true
          description: Execution options supplied when the job was created.
      required:
        [
          job_id,
          job_type,
          status,
          work_id,
          edition_id,
          upload_id,
          progress,
          created_at,
          updated_at,
        ]
    JobListResponse:
      type: object
      additionalProperties: false
      description: Paginated collection of asynchronous jobs.
      properties:
        results:
          type: array
          description: List of job summaries matching query parameters.
          items:
            $ref: "#/components/schemas/JobSummary"
        next_cursor:
          type: string
          description: Opaque cursor for the next page, or empty when no further items exist.
      required: [results, next_cursor]
    JobCancelResponse:
      type: object
      additionalProperties: false
      description: Result of a job cancellation request.
      properties:
        job_id:
          type: string
          description: Unique identifier of the job requested for cancellation.
        status:
          $ref: "#/components/schemas/JobStatus"
        message:
          type: string
          description: Safe human-readable acknowledgement of cancellation request.
      required: [job_id, status, message]
    JobResultResponse:
      type: object
      additionalProperties: false
      description: Download reference and manifest for artifacts produced by a completed job.
      properties:
        job_id:
          type: string
          description: Unique identifier of the completed job.
        status:
          $ref: "#/components/schemas/JobStatus"
        pack_id:
          type: string
          description: Generated graph pack identifier.
        download_url:
          type: string
          description: Short-lived presigned URL. Treat as a bearer capability; do not log or share it.
        expires_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the download URL expires.
        manifest:
          type: object
          additionalProperties: true
          description: Graph pack manifest describing the generated narrative assets.
      required: [job_id, status, pack_id, download_url, expires_at]
    WalletSummary:
      type: object
      additionalProperties: false
      description: Three-bucket Credit wallet summary (`1 Credit = 100 minor_units`, `100 Credits = ¥1.00 RMB`).
      properties:
        user_id:
          type: string
          description: Mixu-internal immutable user UUID.
        promo_credits_minor:
          type: integer
          minimum: 0
          description: Promotional, ad-rewarded, and creator royalty balance in minor units (consumed first).
        sub_credits_minor:
          type: integer
          minimum: 0
          description: Subscription entitlement balance in minor units (consumed second).
        paid_credits_minor:
          type: integer
          minimum: 0
          description: Direct top-up balance in minor units (consumed last, never expires).
        available_balance_minor:
          type: integer
          minimum: 0
          description: Total spendable balance across all three buckets (`promo + sub + paid`).
        reserved_balance_minor:
          type: integer
          minimum: 0
          description: Balance currently held by in-flight job or query reservations.
      required:
        [
          user_id,
          promo_credits_minor,
          sub_credits_minor,
          paid_credits_minor,
          available_balance_minor,
          reserved_balance_minor,
        ]
    AdRewardQrChallengeRequest:
      type: object
      additionalProperties: false
      description: Request payload to generate a short-lived cross-device QR ad session for E-Ink devices.
      properties:
        device_id:
          type: string
          description: Client device identifier requesting the cross-device QR flow.
        eink_mode:
          type: boolean
          default: true
          description: Indicates whether E-Ink policy (`EInkPolicy.isActive`) is active on the requesting device.
      required: [device_id, eink_mode]
    AdRewardQrChallengeResponse:
      type: object
      additionalProperties: false
      description: Short-lived cross-device QR session token for completing a rewarded ad on a companion phone.
      properties:
        challenge_id:
          type: string
          description: Unique challenge identifier bound to the authenticated user and E-Ink device.
        qr_payload:
          type: string
          description: Compact cross-device verification URI/token to encode into a static QR code.
        expires_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the QR challenge expires.
        reward_minor:
          type: integer
          minimum: 1
          description: Promotional credits in minor units (`300 minor_units` = `3 promo_credits`) granted upon completion.
      required: [challenge_id, qr_payload, expires_at, reward_minor]
    AdRewardVerifyRequest:
      type: object
      additionalProperties: false
      description: Server-side verification (SSV) payload for a completed rewarded ad or cross-device QR challenge.
      properties:
        challenge_or_ad_id:
          type: string
          description: E-Ink `challenge_id` or ad network transaction identifier for idempotent reward verification.
        signature:
          type: string
          description: HMAC verification signature proving ad completion.
      required: [challenge_or_ad_id, signature]
    AdRewardVerifyResponse:
      type: object
      additionalProperties: false
      description: Result of verifying a rewarded ad and crediting the user's promotional bucket.
      properties:
        challenge_or_ad_id:
          type: string
          description: Verified challenge or ad transaction identifier.
        granted_minor:
          type: integer
          minimum: 0
          description: Promotional credit amount granted in minor units (`300` on first verification, `0` on duplicate).
        daily_rewarded_minor:
          type: integer
          minimum: 0
          description: Cumulative ad-rewarded minor units granted to this user in the current UTC day.
        daily_cap_minor:
          type: integer
          minimum: 1
          description: Daily maximum ad-rewarded minor units (`3000 minor_units` = `30 Credits/day`).
        wallet:
          $ref: "#/components/schemas/WalletSummary"
      required:
        [
          challenge_or_ad_id,
          granted_minor,
          daily_rewarded_minor,
          daily_cap_minor,
          wallet,
        ]
    PublishMarketplacePackRequest:
      type: object
      additionalProperties: false
      description: Request payload to publish a validated GraphPack to the shared marketplace (`0` upload fee).
      properties:
        epub_sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: L1 exact EPUB binary SHA-256 digest.
        structure_fingerprint:
          type: string
          description: L2 normalized chapter structure skeleton fingerprint.
        isbn:
          type: string
          description: Optional L3 ISBN metadata identifier for cross-edition chapter re-anchoring.
        build_cost_minor:
          type: integer
          minimum: 0
          description: Original GraphPack build cost in minor units (caps creator royalties at `200%`).
      required: [epub_sha256, structure_fingerprint, build_cost_minor]
    MarketplacePackSummary:
      type: object
      additionalProperties: false
      description: Metadata of a GraphPack published in the Community Shared GraphPack Marketplace (ADR-040).
      properties:
        pack_id:
          type: string
        work_id:
          type: string
        edition_id:
          type: string
        epub_sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        structure_fingerprint:
          type: string
        isbn:
          type: string
        build_cost_minor:
          type: integer
          minimum: 0
        royalty_earned_minor:
          type: integer
          minimum: 0
        max_royalty_minor:
          type: integer
          minimum: 0
        download_price_minor:
          type: integer
          minimum: 0
      required:
        [
          pack_id,
          work_id,
          edition_id,
          epub_sha256,
          structure_fingerprint,
          build_cost_minor,
          royalty_earned_minor,
          max_royalty_minor,
          download_price_minor,
        ]
    PurchaseMarketplacePackRequest:
      type: object
      additionalProperties: false
      description: Optional idempotency and edition match parameters when unlocking a shared GraphPack.
      properties:
        idempotency_key:
          type: string
          maxLength: 128
          description: Client-supplied idempotency key to prevent duplicate charges.
        epub_sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: Optional L1 exact EPUB SHA-256 for match resolution.
        structure_fingerprint:
          type: string
          description: Optional L2 chapter structure fingerprint for match resolution.
        isbn:
          type: string
          description: Optional L3 ISBN for match resolution.
    PurchaseMarketplacePackResponse:
      type: object
      additionalProperties: false
      description: Download capability and billing summary after unlocking a shared marketplace GraphPack.
      properties:
        pack_id:
          type: string
        charged_minor:
          type: integer
          minimum: 0
          description: Credits deducted from the buyer (`300 minor_units` = `3 Credits`, or `0` for owner/repeat download).
        royalty_granted_minor:
          type: integer
          minimum: 0
          description: Promotional royalty credited to the original uploader (`100 minor_units` = `1 promo_credit`, up to `200%` of `build_cost_minor`).
        download_url:
          type: string
          description: Short-lived presigned URL. Treat as a bearer capability; do not log or share it.
        expires_at:
          type: string
          format: date-time
        manifest:
          type: object
          additionalProperties: true
      required:
        [
          pack_id,
          charged_minor,
          royalty_granted_minor,
          download_url,
          expires_at,
          manifest,
        ]
    StorageSubscriptionStatus:
      type: string
      enum: [ACTIVE, GRACE_PERIOD, OVER_QUOTA_EVICTED]
      description: Cloud storage subscription lifecycle state with 7-day `GRACE_PERIOD` before excess EPUB binary eviction.
    StorageQuotaSummary:
      type: object
      additionalProperties: false
      description: Cloud storage quota and 7-day subscription grace period summary (ADR-030).
      properties:
        user_id:
          type: string
        quota_limit_bytes:
          type: integer
          minimum: 0
        used_bytes:
          type: integer
          minimum: 0
        subscription_status:
          $ref: "#/components/schemas/StorageSubscriptionStatus"
        grace_period_ends_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the 7-day grace period ends if `subscription_status` is `GRACE_PERIOD`.
      required: [user_id, quota_limit_bytes, used_bytes, subscription_status]
    Error:
      $ref: "./error.schema.json"
  responses:
    BadRequest:
      description: Malformed payload, invalid query parameter or schema validation failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, expired or invalid token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PaymentRequired:
      description: Available credit balance is insufficient for the requested operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but not authorized for this object.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Object does not exist or is not visible to this account.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Concurrent edit or duplicate mutation that cannot be applied as-is.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limit or daily ad reward cap exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: Dependency unavailable; the client must keep local reading intact.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
